name: CI

on:
  push:
    branches: [main, tidilia]
  pull_request:
    branches: [main, tidilia]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --group dev

      - run: uv run ruff check src bin
      - run: uv run ruff format --check src bin

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --group dev

      - run: uv run pytest tests -v
  
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Send deploy request
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.LMS_API_KEY }}" \
            -d "{\"image\":\"ghcr.io/${{ github.repository }}:${{ github.sha }}\"}" \
            https://lms.python-labs.ru/api/deploy-requests
